apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: traceassist-auto-instrumentation
  namespace: traceassist
spec:
  # 1) inject the OTLP headers via env
  env:
    - name: OTEL_EXPORTER_OTLP_HEADERS
      value: "Authorization=Bearer 82b0858a-0573-4057-9848-01b6f0733956"
  # 2) point at the full HTTPS ingest URL
  exporter:
    endpoint: "https://ingest.in.signoz.cloud:4317"
  nodejs: {}
  python: {}
  java: {}
